name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Для tests/test_migrations_postgres.py: миграции досок на той же СУБД, что в проде.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/migrations
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Та же ветка, что в .python-version и на Railway; патч-версию берёт последнюю.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Остальные тесты — на SQLite в памяти, секреты — тестовые значения из tests/conftest.py.
      - run: python -m pytest tests/
