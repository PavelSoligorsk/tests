# Каталог команд GeoGebra Script (английские имена).
# В extra — скобки: Circle(A, 3), не Circle[<...>].
# Execute запрещён.

forbidden:
  - Execute

# Не требуют уже объявленных имён (литералы, вид, текст, графики с формулами).
free:
  - ShowAxes
  - ShowGrid
  - CenterView
  - ZoomIn
  - SetPerspective
  - AxesVisible
  - Text
  - FormulaText
  - FractionText
  - SurdText
  - TableText
  - BarChart
  - Histogram
  - BoxPlot
  - DotPlot
  - PieChart
  - Sequence
  - SlopeField
  - Curve
  - Surface
  - Function

