section: Параллелепипед
topic: Стереометрия
examples:
  - title: Прямоугольный параллелепипед и пространственная диагональ
    prompt: Диагональ прямоугольного параллелепипеда 2×3×6.
    app: "3d"
    height: "400"
    commands:
      - 'SetPerspective("T")'
      - CenterView((0,0,0))
      - ShowAxes(false)
      - ShowGrid(false)
      - A = (0, 0, 0)
      - B = (2, 0, 0)
      - C = (2, 3, 0)
      - D = (0, 3, 0)
      - box_base = Polygon(A, B, C, D)
      - box = Prism(box_base, 6)
      - diag = Segment(A, G)
      - 'SetColor(diag, "#0066ff")'
      - ZoomIn(-2, -2, -1, 5, 6, 8)
