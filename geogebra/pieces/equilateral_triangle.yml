id: equilateral_triangle
summary: "Правильный (равносторонний) треугольник со стороной a. Вершины A,B,C."
app: geometry
params:
  name: {default: tri}
  a: {default: 6}
needs: []
creates:
  - '{{name}}'
  - A
  - B
  - C
commands:
  - 'A = (0, 0)'
  - 'B = ({{a}}, 0)'
  - 'C = ({{a}}/2, {{a}}*sqrt(3)/2)'
  - '{{name}} = Polygon(A, B, C)'
