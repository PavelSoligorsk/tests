id: rectangle
summary: "Прямоугольник a×b. params a — ширина, b — высота. Вершины A,B,C,D."
app: geometry
params:
  name: {default: rect}
  a: {default: 8}
  b: {default: 5}
needs: []
creates:
  - '{{name}}'
  - A
  - B
  - C
  - D
commands:
  - 'A = (0, 0)'
  - 'B = ({{a}}, 0)'
  - 'C = ({{a}}, {{b}})'
  - 'D = (0, {{b}})'
  - '{{name}} = Polygon(A, B, C, D)'
